<!DOCTYPE html>
<html lang="vi">
<head>
<script>try{var d=document.documentElement,k=JSON.parse(localStorage.getItem('mt.skin')||'""');if(k==='scifi')d.setAttribute('data-theme','dark');if(k)d.setAttribute('data-skin',k)}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Kiến thức nền · Minto English IELTS</title>
<meta name="description" content="Kiến thức nền IELTS cho người mới: cách thi, mẹo Listening, Reading, bố cục Writing, Speaking và ngữ pháp band 6+.">
<link rel="icon" type="image/png" href="icons/fav-64.png?v=3">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#a8691a">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#faf8f4;--card:#fff;--line:#e6e0d3;--line2:#ddd7c9;--ink:#1e232b;--dim:#666e7a;--panel2:#f4f0e8;
  --brand:#a8691a;--brand-soft:#f2e2c4;--brand-ink:#6b4410;--ok:#1f8f6c;--ok-soft:#e1f4ec;--bad:#c0473a;--bad-soft:#fbe9e6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.6}
.wrap{max-width:880px;margin:0 auto;padding:0 20px 60px}
.kicker{display:flex;align-items:center;gap:8px;color:var(--brand);font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(30px,5vw,42px);line-height:1.1;margin:0 0 10px;letter-spacing:-.015em}
.lead{color:var(--dim);font-size:16px;margin:0;max-width:60ch}
.top{padding:32px 0 6px}
.progress{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:20px 0 0;box-shadow:0 10px 30px rgba(107,68,16,.06)}
.pring{flex:none;position:relative;width:64px;height:64px}.pring svg{width:64px;height:64px;transform:rotate(-90deg)}
.pring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 17px/1 Fraunces,Georgia,serif;color:var(--brand-ink)}
.pinfo{flex:1;min-width:0}.pinfo b{display:block;font-size:16px}.pinfo span{font-size:13.5px;color:var(--dim)}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:14.5px;text-decoration:none;border-radius:11px;padding:11px 16px;border:1.5px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer;white-space:nowrap}
.btn:hover{background:#94590f}.btn.alt{background:var(--card);color:var(--brand-ink);border-color:var(--line2)}.btn.alt:hover{border-color:var(--brand)}
.btn:focus-visible,.lesson:focus-visible,.chips button:focus-visible{outline:3px solid #f2c879;outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 4px}
.chips button{font:600 13.5px/1 'IBM Plex Sans',sans-serif;border:1px solid var(--line2);background:var(--card);color:var(--dim);border-radius:999px;padding:8px 13px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.grp{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:23px;margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}.grp small{font:500 13px 'IBM Plex Sans',sans-serif;color:var(--dim)}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.lesson{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink);height:100%;transition:border-color .15s,box-shadow .15s,transform .15s}
.lesson:hover{border-color:var(--brand);box-shadow:0 8px 22px rgba(107,68,16,.09);transform:translateY(-1px)}
.lesson .no{flex:none;width:34px;height:34px;border-radius:10px;background:var(--panel2);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font:600 15px/1 Fraunces,Georgia,serif}
.lesson.done .no{background:var(--ok);color:#fff}.lesson.next{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.lesson b{display:block;font-size:15px;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--dim);margin-top:4px}
.lv{display:inline-flex;gap:2px;align-items:center}.lv i{width:6px;height:6px;border-radius:50%;background:var(--line2)}.lv i.on{background:var(--brand)}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--ok-soft);color:var(--ok)}.tag.nx{background:var(--brand-soft);color:var(--brand-ink)}
.tabs{display:flex;gap:4px;background:var(--panel2);border-radius:14px;padding:4px;margin:22px 0 0;max-width:560px}
.tabs a{flex:1;text-align:center;padding:10px 12px;border-radius:11px;text-decoration:none;color:var(--dim);font-weight:700;font-size:14.5px;transition:background .2s,color .2s}
.tabs a[aria-current=page]{background:var(--card);color:var(--brand-ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.seg a{display:flex;flex-direction:column;gap:1px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line2);background:var(--card);text-decoration:none;color:var(--ink);min-width:200px}
.seg a small{color:var(--dim);font-size:12.5px}.seg a b{font-size:15px}
.seg a[aria-current=page]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.mh-note{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px dashed #d9b77a;border-radius:14px;padding:12px 14px;margin:16px 0 0;font-size:14.5px;color:var(--dim)}.mh-note .ic{color:var(--brand);width:22px;height:22px;flex:none;margin-top:1px}
.path{list-style:none;margin:0;padding:0;position:relative}
.path::before{content:"";position:absolute;left:19px;top:20px;bottom:20px;width:2px;background:var(--line)}
.path li{position:relative;padding:5px 0}
.path a{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink)}
.path .dot{position:relative;z-index:1;flex:none;width:40px;height:40px;border-radius:50%;background:var(--paper);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font:600 15px/1 Fraunces,Georgia,serif;color:var(--brand-ink)}
.path .card{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .15s,box-shadow .15s,transform .15s}
.path a:hover .card{border-color:var(--brand);box-shadow:0 8px 22px rgba(107,68,16,.09);transform:translateX(2px)}
.path .card b{display:block;font-size:15px}.path .card small{display:block;color:var(--dim);font-size:13px}
.path .card .ic{margin-left:auto;color:var(--brand);flex:none}
.path .done .dot{background:var(--ok);border-color:var(--ok);color:#fff}.path .done .card .ic{color:var(--ok)}
/* bài học */
.mback{display:inline-flex;align-items:center;gap:6px;color:var(--brand-ink);text-decoration:none;font-weight:600;font-size:14px;margin:24px 0 10px}
.art h1{margin-bottom:6px}.art .meta{font-size:13.5px;margin:0 0 16px}
.why{display:flex;gap:12px;background:linear-gradient(120deg,#fff7e8,#fdf0d8);border:1px solid #ecd3a6;border-radius:14px;padding:14px 16px;margin:0 0 8px}
.why .ic{color:var(--brand);width:24px;height:24px;margin-top:1px}.why p{margin:0}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 20px 14px;margin:14px 0}
.sec h2{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:22px;margin:14px 0 8px}
.sec p{margin:8px 0}.sec ul,.sec ol{padding-left:22px;margin:8px 0}.sec li{margin:4px 0}
.sec table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14.5px;display:block;overflow-x:auto}
.sec th,.sec td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}.sec th{background:var(--panel2);font-weight:700;white-space:nowrap}
.en{color:var(--brand-ink);font-weight:600}.vi{color:var(--dim);font-style:italic}
.ex{background:var(--panel2);border-left:3px solid var(--brand);border-radius:8px;padding:9px 13px;margin:10px 0}
.note{background:#eef6f2;border:1px solid #cfe7dc;border-radius:10px;padding:9px 13px;margin:10px 0;color:#1d5c48}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.box{border-radius:14px;padding:12px 16px;border:1px solid var(--line);background:var(--card)}
.box h3{display:flex;gap:8px;align-items:center;font-size:15px;margin:2px 0 6px}.box ul{margin:0;padding-left:20px}.box li{margin:5px 0;font-size:14.5px}
.box.tip h3{color:var(--ok)}.box.mis h3{color:var(--bad)}
.quiz{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 20px 18px;margin:18px 0}
.quiz>h2{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:22px;margin:14px 0 2px}.quiz>p{margin:0 0 6px;color:var(--dim);font-size:14px}
.q{padding:14px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}
.qt{font-weight:600;margin:0 0 8px}.qt span{color:var(--brand);margin-right:6px}
.opts{display:grid;gap:6px}
.opts button{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;font-size:15px;background:var(--card);border:1.5px solid var(--line2);border-radius:11px;padding:9px 12px;cursor:pointer;color:var(--ink)}
.opts button:hover:not(:disabled){border-color:var(--brand)}
.opts button i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:13px;color:var(--dim)}
.opts button:disabled{cursor:default}
.opts button.right{border-color:var(--ok);background:var(--ok-soft)}.opts button.right i{background:var(--ok);color:#fff}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}.opts button.wrong i{background:var(--bad);color:#fff}
.exp{margin:8px 0 0;padding:9px 12px;border-radius:10px;background:var(--panel2);font-size:14.5px}.exp b{margin-right:4px}
.score{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:16px 0 0;padding:14px 16px;border-radius:14px;background:linear-gradient(120deg,#fff7e8,#fdf0d8);border:1px solid #ecd3a6}
.score b{font:600 30px/1 Fraunces,Georgia,serif;color:var(--brand-ink)}.score span{flex:1 1 200px}
.navl{display:flex;justify-content:space-between;gap:10px;margin:18px 0 0;flex-wrap:wrap}
html[data-theme=dark] :is(.why,.score){background:linear-gradient(120deg,#2a2216,#231c12)!important;border-color:#5a4422!important}
html[data-theme=dark] .note{background:#163a2d;border-color:#245c47;color:#a9e2cb}
html[data-theme=dark] :is(.opts button,.quiz,.sec,.lesson,.progress,.chips button:not([aria-pressed=true])){background:var(--card)!important}
html[data-theme=dark] .opts button.right{background:var(--ok-soft)!important}html[data-theme=dark] .opts button.wrong{background:var(--bad-soft)!important}
html[data-theme=dark] .ex,html[data-theme=dark] .exp{background:var(--panel2)!important}
@media (max-width:620px){.boxes{grid-template-columns:1fr}.sec,.quiz{padding:4px 15px 12px}.progress{flex-wrap:wrap}.progress .btn{width:100%;justify-content:center}}
</style>
</head>
<body data-nav="nen">
<div class="wrap" id="app"></div>
<script src="shared/nen-data.js"></script>
<script src="shared/ui.js?v=6"></script>
<script>
(function(){
  var SITE='ielts', K='mt.nen.'+SITE, L=window.NEN||[], I=window.MICON||function(){return '';};
  function get(){ try{ return JSON.parse(localStorage.getItem(K))||{}; }catch(e){ return {}; } }
  function put(v){ try{ localStorage.setItem(K,JSON.stringify(v)); }catch(e){} }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var LV=['','Cơ bản','Trung bình','Nâng cao'], groups=[]; L.forEach(function(l){ if(groups.indexOf(l.group)<0) groups.push(l.group); });
  var app=document.getElementById('app'), filter='';
  try{ filter=sessionStorage.getItem('nen.f')||''; }catch(e){}
  function lv(n){ var s='<span class="lv" title="'+LV[n]+'">'; for(var i=1;i<=3;i++) s+='<i class="'+(i<=n?'on':'')+'"></i>'; return s+' '+LV[n]+'</span>'; }
  function nextIdx(p){ for(var i=0;i<L.length;i++) if(!p[L[i].id]) return i; return -1; }
  function list(){
    var p=get(), done=L.filter(function(l){return p[l.id];}).length, nx=nextIdx(p), C=2*Math.PI*28;
    document.title='Kiến thức nền · Minto English IELTS';
    var h='<div class="top"><p class="kicker">'+I('layers')+'Kiến thức nền · IELTS</p><h1>Học chắc nền, làm đề nhẹ hơn</h1><p class="lead">Dành cho bạn mới bắt đầu IELTS: hiểu cách thi và cách tính band, mẹo từng kỹ năng, bố cục bài Writing, cách trả lời Speaking và ngữ pháp cần cho band 6+. Giải thích tiếng Việt, có bài tập nhỏ.</p>'+
      '<div class="progress"><span class="pring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="var(--panel2)" stroke-width="6"/><circle cx="32" cy="32" r="28" fill="none" stroke="var(--brand)" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+(C*done/L.length).toFixed(1)+' '+C.toFixed(1)+'"/></svg><b>'+done+'/'+L.length+'</b></span>'+
      '<span class="pinfo"><b>'+(done===L.length?'Bạn đã học hết các bài, giỏi lắm!':done?'Đã học '+done+' bài, tiếp tục nhé':'Chưa học bài nào, bắt đầu từ bài 1 nhé')+'</b><span>'+(nx>=0?'Bài tiếp theo: '+esc(L[nx].title):'Có thể làm lại bài tập bất kỳ lúc nào để ôn.')+'</span></span>'+
      (nx>=0?'<a class="btn" href="#'+L[nx].id+'">'+I('play')+(done?'Học tiếp':'Bắt đầu học')+'</a>':'')+'</div>'+
      '<div class="chips" role="group" aria-label="Lọc theo nhóm"><button type="button" data-g="" aria-pressed="'+(!filter)+'">Tất cả</button>'+groups.map(function(g){ return '<button type="button" data-g="'+esc(g)+'" aria-pressed="'+(filter===g)+'">'+esc(g)+'</button>'; }).join('')+'</div></div>';
    groups.forEach(function(g){
      if(filter&&filter!==g) return;
      var ls=L.map(function(l,i){ return [l,i]; }).filter(function(x){ return x[0].group===g; });
      var gd=ls.filter(function(x){ return p[x[0].id]; }).length;
      h+='<h2 class="grp">'+esc(g)+'<small>'+gd+'/'+ls.length+' bài</small></h2><ul class="list">'+ls.map(function(x){
        var l=x[0], i=x[1], r=p[l.id];
        return '<li><a class="lesson'+(r?' done':'')+(i===nx?' next':'')+'" href="#'+l.id+'"><span class="no">'+(r?I('check'):i+1)+'</span><span><b>'+esc(l.title)+'</b><span class="meta">'+lv(l.level)+'<span>'+I('clock')+' '+l.mins+' phút</span>'+(r?'<span class="tag">Đúng '+r.s+'/'+r.n+'</span>':i===nx?'<span class="tag nx">Học tiếp</span>':'')+'</span></span></a></li>';
      }).join('')+'</ul>';
    });
    app.innerHTML=h;
    [].forEach.call(app.querySelectorAll('.chips button'),function(b){ b.onclick=function(){ filter=b.getAttribute('data-g'); try{ sessionStorage.setItem('nen.f',filter); }catch(e){} list(); }; });
    if(window.MFX) MFX(app);
  }
  function lesson(i){
    var l=L[i], p=get(), r=p[l.id], ans={};
    document.title=l.title+' · Kiến thức nền';
    var h='<a class="mback" href="#">'+I('arrow').replace('<svg','<svg style="transform:rotate(180deg)"')+' Tất cả bài học</a><article class="art"><p class="kicker">'+esc(l.group)+' · Bài '+(i+1)+'/'+L.length+'</p><h1>'+esc(l.title)+'</h1><div class="meta">'+lv(l.level)+'<span>'+I('clock')+' '+l.mins+' phút</span>'+(r?'<span class="tag">Đã học · đúng '+r.s+'/'+r.n+'</span>':'')+'</div>'+
      '<div class="why">'+I('target')+'<p><b>Vì sao cần học?</b> '+esc(l.why)+'</p></div>';
    (l.sections||[]).forEach(function(s){ h+='<section class="sec"><h2>'+esc(s.h)+'</h2>'+s.html+'</section>'; });
    var tp=l.tips||[], ms=l.mistakes||[];
    if(tp.length||ms.length) h+='<div class="boxes">'+(tp.length?'<div class="box tip"><h3>'+I('check')+'Mẹo nhớ nhanh</h3><ul>'+tp.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></div>':'')+(ms.length?'<div class="box mis"><h3>'+I('help')+'Lỗi hay gặp</h3><ul>'+ms.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></div>':'')+'</div>';
    h+='<section class="quiz" id="quiz"><h2>Luyện tập nhanh</h2><p>'+l.quiz.length+' câu. Chọn đáp án là biết đúng sai và xem giải thích ngay.</p>'+l.quiz.map(function(q,k){
      return '<div class="q" data-k="'+k+'"><p class="qt"><span>'+(k+1)+'.</span>'+esc(q.q).replace(/_{3,}/g,'<b>_____</b>')+'</p><div class="opts">'+q.opts.map(function(o,j){ return '<button type="button" data-j="'+j+'"><i>'+'ABCD'[j]+'</i><span>'+esc(o)+'</span></button>'; }).join('')+'</div></div>';
    }).join('')+'<div id="sc"></div></section>';
    h+='<div class="navl">'+(i>0?'<a class="btn alt" href="#'+L[i-1].id+'">← Bài trước</a>':'<span></span>')+(i<L.length-1?'<a class="btn" href="#'+L[i+1].id+'">Bài tiếp theo →</a>':'<a class="btn" href="#">Về danh sách</a>')+'</div></article>';
    app.innerHTML=h; window.scrollTo(0,0);
    [].forEach.call(app.querySelectorAll('.q'),function(qd){
      var k=+qd.getAttribute('data-k'), q=l.quiz[k];
      [].forEach.call(qd.querySelectorAll('.opts button'),function(b){ b.onclick=function(){
        var j=+b.getAttribute('data-j'); ans[k]=j===q.a; if(window.MCOMBO) MCOMBO(ans[k],b);
        [].forEach.call(qd.querySelectorAll('.opts button'),function(x){ x.disabled=true; var jj=+x.getAttribute('data-j'); if(jj===q.a) x.classList.add('right'); else if(jj===j) x.classList.add('wrong'); });
        var e=document.createElement('div'); e.className='exp'; e.innerHTML='<b style="color:'+(ans[k]?'var(--ok)':'var(--bad)')+'">'+(ans[k]?'Chính xác!':'Chưa đúng.')+'</b>'+esc(q.ex); qd.appendChild(e);
        if(Object.keys(ans).length===l.quiz.length) finish();
      }; });
    });
    function finish(){
      var s=0; for(var k in ans) if(ans[k]) s++; var n=l.quiz.length, pp=get(), old=pp[l.id];
      pp[l.id]={s:Math.max(s,old?old.s:0),n:n,t:Date.now(),last:s}; put(pp);
      var msg=s===n?'Tuyệt vời, đúng hết!':s>=n*0.7?'Tốt lắm! Xem lại câu sai rồi học bài tiếp nhé.':'Chưa sao, đọc lại phần lý thuyết rồi làm lại cho chắc nhé.';
      document.getElementById('sc').innerHTML='<div class="score">'+(window.MMINT?MMINT(s===n?'love':s>=n*0.7?'cheer':'think'):'')+'<b>'+s+'/'+n+'</b><span>'+msg+'<br><small style="color:var(--dim)">Đã lưu tiến độ bài này.</small></span><button type="button" class="btn alt" id="again">Làm lại</button>'+(i<L.length-1?'<a class="btn" href="#'+L[i+1].id+'">Bài tiếp theo →</a>':'')+'</div>';
      document.getElementById('again').onclick=function(){ lesson(i); setTimeout(function(){ document.getElementById('quiz').scrollIntoView(); },30); };
      if(s===n&&window.MCONFETTI) MCONFETTI();
    }
  }
  function route(){ var id=decodeURIComponent(location.hash.slice(1)), i=-1; L.forEach(function(l,k){ if(l.id===id) i=k; }); if(i>=0) lesson(i); else list(); }
  addEventListener('hashchange',route); route();
})();
</script>
</body>
</html>
