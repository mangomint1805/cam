<style>
:root{color-scheme:light;--paper:#faf8f4;--card:#fff;--line:#ddd7c9;--ink:#1e232b;--dim:#666e7a;--panel2:#f2efe8;--brand:#a8691a;--brand-soft:#f2e2c4;--brand-ink:#6b4410;--amber:#a8691a;--amber-soft:#f2e2c4;--amber-ink:#6b4410}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
header{padding:40px 0 6px}
.back{font-size:14px;font-weight:700;color:var(--brand-ink);text-decoration:none}
.kicker{color:var(--brand);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 6px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(30px,6vw,42px);line-height:1.1;margin:0 0 10px}
header p{margin:0;color:var(--dim);max-width:60ch}
.cn-tl{list-style:none;margin:22px 0 10px;padding:0;position:relative}
.cn-tl::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;background:var(--line)}
.cn-ent{position:relative;padding-left:38px;margin:0 0 18px}
.cn-dot{position:absolute;left:3px;top:20px;width:18px;height:18px;border-radius:50%;background:var(--paper);border:3px solid var(--brand)}
.cn-ent.new .cn-dot{background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.cn-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 18px 14px}
.cn-ent.new .cn-box{border-color:var(--brand);box-shadow:0 6px 22px rgba(30,35,43,.08)}
.cn-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 6px}
.cn-date{display:inline-block;font-size:13px;font-weight:700;color:var(--brand-ink);background:var(--brand-soft);border-radius:999px;padding:2px 11px}
.cn-day{font-size:13px;color:var(--dim)}
.cn-new{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--paper);background:var(--brand);border-radius:999px;padding:2px 9px}
.cn-box h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:21px;line-height:1.25;margin:0 0 8px}
.cn-box ul{margin:0;padding-left:20px}
.cn-box li{margin:5px 0}
.cn-empty{color:var(--dim);background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:16px 18px}
.cn-other{display:inline-block;margin:4px 0 0;font-size:14px;font-weight:600;color:var(--brand-ink)}
footer{padding:18px 0 50px;color:var(--dim);font-size:13px}
html[data-theme=dark] .cn-ent.new .cn-box{box-shadow:0 8px 26px rgba(0,0,0,.4)}
html[data-skin=scifi] .cn-dot{border-color:#4ad7ff}html[data-skin=scifi] .cn-ent.new .cn-dot{background:#4ad7ff;box-shadow:0 0 0 4px rgba(74,215,255,.18),0 0 14px rgba(74,215,255,.5)}
html[data-skin=scifi] .cn-ent.new .cn-box{border-color:#4ad7ff}html[data-skin=scifi] .cn-tl::before{background:linear-gradient(#4ad7ff,#b04cff)}
@media (max-width:520px){header{padding-top:28px}.cn-ent{padding-left:28px}.cn-tl::before{left:7px}.cn-dot{left:0;width:16px;height:16px}.cn-box{padding:13px 14px 12px}.cn-box h2{font-size:19px}.cn-box ul{padding-left:18px}}

<body data-nav="news">
<div class="wrap">
  <header>
    <a class="back" href="./">← Tất cả bộ đề</a>
    <p class="kicker">Có gì mới · nhật ký cập nhật</p>
    <h1>Web IELTS vừa có gì mới?</h1>
    <p>Thầy cập nhật web thường xuyên. Đây là những điểm mới gần đây, mới nhất ở trên cùng.</p>
  </header>
  <main>
    <ol class="cn-tl" id="cnList" aria-label="Các lần cập nhật"></ol>
    <noscript><p class="cn-empty">Bật JavaScript để xem danh sách cập nhật.</p></noscript>
    <a class="cn-other" href="https://mangomint1805.github.io/toeic/cap-nhat.html">Xem cả: có gì mới trên web TOEIC →</a>
  </main>
  <footer>Thấy lỗi hay có ý tưởng hay? Bấm nút Góp ý trên thanh menu để báo thầy nhé.</footer>
</div>
<script src="cap-nhat.js?v=1"></script>
<script>
(function () {
  var U = window.MT_UPDATES || [], el = document.getElementById('cnList');
  var DAY = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  if (!U.length) { el.outerHTML = '<p class="cn-empty">Chưa tải được danh sách cập nhật. Thử tải lại trang nhé.</p>'; return; }
  el.innerHTML = U.map(function (u, i) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(u.id || ''), day = m ? DAY[new Date(+m[1], +m[2] - 1, +m[3]).getDay()] : '';
    return '<li class="cn-ent' + (i === 0 ? ' new' : '') + '" id="u-' + esc(u.id) + '"><span class="cn-dot" aria-hidden="true"></span><article class="cn-box">' +
      '<div class="cn-meta"><span class="cn-date">' + esc(u.date) + '</span>' + (day ? '<span class="cn-day">' + day + '</span>' : '') + (i === 0 ? '<span class="cn-new">Mới</span>' : '') + '</div>' +
      '<h2>' + esc(u.title) + '</h2><ul>' + (u.items || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></article></li>';
  }).join('');
  try { localStorage.setItem('mt.seenUpdate', U[0].id); } catch (e) {}
})();
</script>
