<html lang="vi">
<head>
<script>try{var d=document.documentElement,k=JSON.parse(localStorage.getItem('mt.skin')||'""');if(k==='scifi')d.setAttribute('data-theme','dark');if(k)d.setAttribute('data-skin',k)}catch(e){}</script>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#a8691a">
<link rel="apple-touch-icon" href="icons/apple-180.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Flashcard từ vựng của tôi</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#faf8f4;--card:#fff;--line:#ddd7c9;--ink:#1e232b;--dim:#666e7a;--panel2:#f2efe8;--brand:#a8691a;--brand-soft:#f2e2c4;--brand-ink:#6b4410;--ok:#1f8f6c;--ok-soft:#e1f4ec;--bad:#c14636;--bad-soft:#fbe6e2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 50px}
header{padding:36px 0 14px}
.back{font-size:14px;font-weight:700;color:var(--brand-ink);text-decoration:none}
h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(30px,6vw,42px);margin:14px 0 6px;line-height:1.1}
header p{margin:0;color:var(--dim)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.tabs button{font:inherit;font-weight:600;font-size:14px;border:1.5px solid var(--line);background:#fff;color:var(--dim);border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.fc{perspective:1200px;margin:6px 0 14px}
.fc-in{position:relative;min-height:260px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--brand);border-radius:16px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 8px 24px rgba(107,68,16,.08)}
.back-f{transform:rotateY(180deg)}
.word{font-family:'Fraunces',Georgia,serif;font-size:40px;font-weight:600;color:var(--brand-ink);line-height:1.1}
.ipa{color:var(--dim);margin:6px 0}
.mean{font-size:17px;margin:6px 0}
.ex{font-size:14.5px;color:#3b4350;font-style:italic;margin-top:10px;max-width:56ch}
.ex b{color:var(--brand-ink);font-style:normal}
.src{font-size:12px;color:var(--dim);margin-top:8px}
.tip{font-size:13px;color:var(--dim);margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-weight:700;font-size:15px;border:1.5px solid var(--brand);background:#fff;color:var(--brand-ink);border-radius:10px;padding:10px 16px;cursor:pointer}
.btn.no{border-color:var(--bad);color:var(--bad)}.btn.yes{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{font-size:13px;padding:5px 10px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin-top:8px}
.rate .btn{padding:9px 4px;font-size:14.5px;line-height:1.2}
.rate .btn small{display:block;font-weight:500;font-size:11.5px;opacity:.85;margin-top:2px}
.btn.hard{border-color:#c98a1a;color:#8a5a00}.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}.btn.easy{background:#2f6fd0;border-color:#2f6fd0;color:#fff}
.keys{text-align:center;font-size:12px;color:var(--dim);margin-top:8px}@media (hover:none){.keys{display:none}}
@media (max-width:420px){.rate .btn{font-size:13px}.rate .btn small{font-size:10.5px}}
.prog{text-align:center;color:var(--dim);font-size:14px;margin:4px 0 10px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--dim)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}
th{background:var(--panel2)}
td .w{font-weight:700;color:var(--brand-ink)}
.lv{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--panel2);color:var(--dim)}
.lv.m{background:var(--ok-soft);color:var(--ok)}
.x{border:0;background:none;color:var(--bad);cursor:pointer;font-size:16px}
</style>
<link rel="icon" type="image/png" href="icons/fav-64.png?v=3">
</head>
<body data-nav="cards">
<div class="wrap">
  <header>
    <a class="back" href="./">← Trang chủ</a>
    <h1>Flashcard của tôi</h1>
    <p>Những từ bạn bấm <b>☆ Lưu flashcard</b> khi tra từ trong bài. Bộ thẻ dùng chung cho cả web TOEIC và IELTS, lưu trên máy này.</p>
  </header>
  <div class="tabs" role="tablist">
    <button type="button" data-v="learn" aria-selected="true">🃏 Ôn tập</button>
    <button type="button" data-v="list" aria-selected="false">📋 Danh sách</button>
  </div>
  <div id="main"></div>
</div>
<script src="shared/fsrs.js?v=1"></script>
<script>
(function(){
  var KEY='vocab.cards', V='learn', queue=[], i=0;
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
  function save(c){ try{ localStorage.setItem(KEY,JSON.stringify(c)); }catch(e){} }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function say(t){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.9; speechSynthesis.speak(u); }catch(e){} }
  function hl(ex,w){ var re=new RegExp('\\b('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*)','ig'); return esc(ex).replace(re,'<b>$1</b>'); }
  var main=document.getElementById('main');
  [].forEach.call(document.querySelectorAll('.tabs button'),function(b){ b.onclick=function(){ V=b.dataset.v; [].forEach.call(document.querySelectorAll('.tabs button'),function(x){ x.setAttribute('aria-selected',String(x===b)); }); render(); }; });
  var INT=[0,1,2,4,7,15,30], extra=false;
  // Lịch ôn theo FSRS (ts-fsrs, thuật toán của Anki): mỗi thẻ có độ ổn định (s) và độ khó (d); 4 mức đánh giá Quên / Khó / Nhớ / Dễ.
  // Vẫn ghi c.due (YYYY-MM-DD), c.box, c.lv như cũ để các trang khác (trang chủ, tra từ) đếm "cần ôn hôm nay" không phải sửa.
  var FS = window.FSRS && window.FSRS.fsrs ? window.FSRS : null, SCH = FS ? FS.fsrs({ request_retention: 0.9, maximum_interval: 365, enable_fuzz: true, enable_short_term: false }) : null;
  function toCard(c){
    var f=c.f;
    if(f) return { due:new Date(f.due), stability:f.s, difficulty:f.d, elapsed_days:f.e||0, scheduled_days:f.sd||0, learning_steps:f.ls||0, reps:f.r||0, lapses:f.l||0, state:f.st, last_review:f.lr?new Date(f.lr):undefined };
    var bx=box(c), now=new Date();
    if(!bx || !c.due) return FS.createEmptyCard(now);
    // thẻ ôn theo cách cũ (hộp 1–6): coi như đã nhớ được INT[hộp] ngày
    var due=new Date(c.due+'T08:00:00'), iv=INT[bx], lr=new Date(due.getTime()-iv*864e5);
    return { due:due, stability:Math.max(.5,iv), difficulty:5, elapsed_days:0, scheduled_days:iv, learning_steps:0, reps:bx, lapses:0, state:FS.State.Review, last_review:lr };
  }
  function fromCard(c,k){
    c.f={ due:k.due.toISOString(), s:+k.stability.toFixed(3), d:+k.difficulty.toFixed(3), e:k.elapsed_days, sd:k.scheduled_days, ls:k.learning_steps||0, r:k.reps, l:k.lapses, st:k.state, lr:k.last_review?new Date(k.last_review).toISOString():null };
    c.due=dk(k.due);
    var s=k.stability, b=s<1?0:s<2?1:s<4?2:s<7?3:s<15?4:s<30?5:6; c.box=b; c.lv=b>=5?3:Math.floor(b/2);
  }
  function days(n){ return n<=0?'hôm nay':n===1?'1 ngày':n<31?n+' ngày':n<365?Math.round(n/30)+' tháng':'1 năm'; }
  function dk(d){ d=d||new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function addDays(n){ var d=new Date(); d.setDate(d.getDate()+n); return dk(d); }
  function fmt(k){ var p=k.split('-'); return p[2]+'/'+p[1]; }
  function box(c){ return c.box!=null?c.box:Math.min(6,(c.lv||0)*2); }
  function isDue(c){ return !c.due || c.due<=dk(); }
  function build(){ var C=load(); queue=Object.keys(C).filter(function(k){ return extra ? box(C[k])<6 : isDue(C[k]); }).sort(function(a,b){ return (C[a].due||'').localeCompare(C[b].due||'') || box(C[a])-box(C[b]); }); i=0; }
  // 4 nút đánh giá, dưới mỗi nút là lần ôn tiếp theo nếu chọn nút đó
  function rateRow(c,bx){
    if(!SCH) return '<div class="row" style="margin-top:8px"><button class="btn no" data-g="1">✗ Chưa nhớ<small style="display:block;font-weight:500;font-size:11px;opacity:.8">gặp lại hôm nay</small></button><button class="btn yes" data-g="3">✓ Nhớ rồi<small style="display:block;font-weight:500;font-size:11px;opacity:.85">ôn lại sau '+INT[Math.min(6,bx+1)]+' ngày</small></button></div>';
    var p=SCH.repeat(toCard(c), new Date()), L=[[1,'no','✗ Quên'],[2,'hard','😓 Khó'],[3,'good','🙂 Nhớ'],[4,'easy','😎 Dễ']];
    return '<div class="rate">'+L.map(function(x){ return '<button class="btn '+x[1]+'" data-g="'+x[0]+'">'+x[2]+'<small>'+(x[0]===1?'gặp lại ngay':days(p[x[0]].card.scheduled_days))+'</small></button>'; }).join('')+'</div><p class="keys">Phím tắt: Space lật thẻ · 1 Quên · 2 Khó · 3 Nhớ · 4 Dễ</p>';
  }
  function render(){
    var C=load(), all=Object.keys(C);
    if(!all.length){ main.innerHTML='<div class="empty">Chưa có từ nào. Khi làm bài hoặc xem lại, <b>bấm vào một từ tiếng Anh</b> → bấm <b>☆ Lưu flashcard</b> là từ đó sẽ vào đây.</div>'; return; }
    var dueN=all.filter(function(k){ return isDue(C[k]); }).length, mast=all.filter(function(k){ return box(C[k])>=5; }).length;
    if(V==='list'){
      var rows=all.sort(function(a,b){ return C[b].at-C[a].at; }).map(function(k){ var c=C[k], bx=box(c); return '<tr><td><span class="w">'+esc(c.w)+'</span><br><small>'+esc(c.ipa)+'</small></td><td>'+esc(c.m)+'<br><small><i>'+esc(c.ex||'')+'</i></small></td><td>'+(bx>=5?'<span class="lv m">Đã thuộc</span>':'<span class="lv">Mức '+bx+'/6</span>')+'<br><small>'+(isDue(c)?'Ôn hôm nay':'Ôn ngày '+fmt(c.due))+'</small></td><td><button class="x" data-del="'+esc(k)+'" aria-label="Xoá">✕</button></td></tr>'; }).join('');
      main.innerHTML='<p class="prog">'+all.length+' từ · '+mast+' từ đã thuộc · '+dueN+' từ cần ôn hôm nay</p><table><tr><th>Từ</th><th>Nghĩa · ví dụ</th><th>Mức</th><th></th></tr>'+rows+'</table>';
      [].forEach.call(main.querySelectorAll('[data-del]'),function(b){ b.onclick=function(){ var C2=load(); delete C2[b.dataset.del]; save(C2); render(); }; });
      return;
    }
    if(i>=queue.length) build();
    if(!queue.length){
      var next=all.map(function(k){ return C[k].due; }).filter(function(d){ return d && d>dk(); }).sort()[0], nN=next?all.filter(function(k){ return C[k].due===next; }).length:0;
      main.innerHTML='<div class="empty">🎉 Hôm nay bạn đã ôn xong tất cả từ cần ôn!'+(next?'<br>Lần ôn tiếp theo: <b>'+fmt(next)+'</b> ('+nN+' từ).':'')+'<br><small>Web tự hẹn lịch theo cách bạn chấm mỗi thẻ (thuật toán FSRS, giống Anki): từ hay quên gặp lại sớm, từ nhớ chắc giãn dần ra vài tuần, vài tháng.</small><br><br><button class="btn sm" id="rs">Ôn thêm trước hạn</button></div>';
      document.getElementById('rs').onclick=function(){ extra=true; build(); render(); }; return; }
    var c=C[queue[i]], bx=box(c);
    main.innerHTML='<p class="prog">'+(extra?'Ôn thêm · ':'Cần ôn hôm nay · ')+'thẻ '+(i+1)+' / '+queue.length+' · mức '+bx+'/6</p><div class="fc" id="fc"><div class="fc-in">'+
      '<div class="face"><div class="word">'+esc(c.w)+'</div><div class="ipa">'+esc(c.ipa)+'</div>'+(c.ex?'<div class="ex">'+hl(c.ex,c.w)+'</div>':'')+'<div class="tip">Đoán nghĩa rồi bấm vào thẻ để lật</div></div>'+
      '<div class="face back-f"><div class="word" style="font-size:28px">'+esc(c.w)+'</div><div class="mean">'+esc(c.m)+'</div>'+(c.ex?'<div class="ex">'+hl(c.ex,c.w)+'</div>':'')+'<div class="src">'+esc(c.src||'')+'</div></div>'+
      '</div></div><div class="row"><button class="btn sm" id="sp">🔊 Nghe</button></div>'+rateRow(c,bx);
    var fc=document.getElementById('fc'); fc.onclick=function(){ fc.classList.toggle('flip'); };
    document.getElementById('sp').onclick=function(){ say(c.w); };
    function next(ok){ var C2=load(), k=queue[i], x=C2[k]; if(x){ var b2=box(x); if(ok){ b2=Math.min(6,b2+1); x.due=addDays(INT[b2]); } else { b2=0; x.due=dk(); queue.push(k); } x.box=b2; x.lv=b2>=5?3:Math.floor(b2/2); save(C2); } i++; render(); }
    function rate(g){ if(!SCH) return next(g>1); var C2=load(), k=queue[i], x=C2[k]; if(x){ var r=SCH.next(toCard(x), new Date(), g); fromCard(x, r.card); if(g===1) queue.push(k); save(C2); } i++; render(); }
    [].forEach.call(main.querySelectorAll('[data-g]'),function(b){ b.onclick=function(e){ e.stopPropagation(); rate(+b.dataset.g); }; });
    document.onkeydown=function(e){ if(V!=='learn'||e.target.tagName==='INPUT') return; if(e.key===' '){ e.preventDefault(); fc.classList.toggle('flip'); } else if(/^[1-4]$/.test(e.key)){ var b=main.querySelector('[data-g="'+e.key+'"]'); if(b) b.click(); } };
  }
  build(); render();
})();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});});</script>
<script src="shared/ui.js?v=12"></script>
</body>
</html>
