<!DOCTYPE html>
<html lang="vi">
<head>
<script>try{var d=document.documentElement,k=JSON.parse(localStorage.getItem('mt.skin')||'""');if(k==='scifi')d.setAttribute('data-theme','dark');if(k)d.setAttribute('data-skin',k)}catch(e){}</script>

<meta name="theme-color" content="#a8691a">

<title>Câu đã đánh dấu · IELTS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#faf8f4;--card:#fff;--line:#ddd7c9;--ink:#1e232b;--dim:#666e7a;--panel2:#f2efe8;--brand:#a8691a;--brand-soft:#f2e2c4;--brand-ink:#6b4410;--ok:#1f8f6c;--ok-soft:#e1f4ec;--bad:#c14636;--bad-soft:#fbe6e2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 50px}
header{padding:26px 0 8px}
.mback{font-size:14px;font-weight:700;color:var(--brand-ink);text-decoration:none}
h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(28px,6vw,40px);margin:10px 0 4px;line-height:1.1}
header p{margin:0;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-size:13px;font-weight:700;color:var(--dim);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.chip{font:inherit;font-weight:600;font-size:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip small{font-weight:500;opacity:.8}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;background:var(--brand);color:#fff;border-radius:12px;padding:12px 20px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--brand-ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:13px;color:var(--dim)}
.best{display:flex;gap:10px;margin-top:12px}
.best div{flex:1;background:var(--panel2);border-radius:12px;padding:8px 12px}.best b{display:block;font:600 24px/1.1 Fraunces,Georgia,serif;color:var(--brand-ink)}.best span{font-size:12.5px;color:var(--dim)}
/* marks */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.grp{margin:18px 0 6px;font:600 20px/1.2 Fraunces,Georgia,serif;color:var(--brand-ink)}
.mk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:start}
.mk .st{font-size:22px;line-height:1;border:0;background:none;cursor:pointer;padding:2px;color:#e0a520}
.mk .meta{font-size:12.5px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.mk .tx{font-size:15.5px}
.mk a{font-weight:700;font-size:14px;color:var(--brand-ink);white-space:nowrap;text-decoration:none}
.mk textarea{grid-column:2/4;width:100%;min-height:44px;border:1.5px dashed var(--line);border-radius:10px;padding:7px 10px;font:14px/1.5 'IBM Plex Sans',sans-serif;background:#fffdf6;color:inherit;resize:vertical}
html[data-theme=dark] .mk textarea{background:rgba(255,255,255,.04)}
.mk .del{border:0;background:none;color:var(--dim);cursor:pointer;font-size:13px;grid-column:3;justify-self:end}
@media(max-width:560px){.mk{grid-template-columns:auto 1fr}.mk a{grid-column:2;grid-row:2}.mk textarea{grid-column:1/3}.mk .del{grid-column:2}}
.empty{text-align:center;padding:30px 10px;color:var(--dim)}
.empty .et{display:block;font:600 20px/1.3 Fraunces,Georgia,serif;color:var(--ink);margin-bottom:6px}
</style>
</head>
<body data-nav="marks">
<div class="wrap">
  <header>
    <a class="mback" href="./">← Trang chủ</a>
    <h1>Câu đã đánh dấu</h1>
    <p>Những câu bạn bấm ☆ hoặc viết 📝 ghi chú trong lúc làm đề. Lưu trên máy này — nhớ “Sao lưu” trong ⚙ nếu đổi máy.</p>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="main"></div>
</div>
<script>
(function(){
  var KEY='mt.marks.ielts', main=document.getElementById('main'), tabs=document.getElementById('tabs'), F='all';
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
  function save(o){ try{ localStorage.setItem(KEY,JSON.stringify(o)); }catch(e){} }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function render(){
    var A=load(), keys=Object.keys(A);
    var nS=keys.filter(function(k){return A[k].s;}).length, nN=keys.filter(function(k){return A[k].note;}).length;
    tabs.innerHTML=[['all','Tất cả',keys.length],['s','★ Đánh dấu',nS],['n','📝 Có ghi chú',nN]].map(function(t){ return '<button class="chip" data-f="'+t[0]+'" aria-pressed="'+(F===t[0])+'">'+t[1]+' <small>'+t[2]+'</small></button>'; }).join('');
    [].forEach.call(tabs.querySelectorAll('[data-f]'),function(b){ b.onclick=function(){ F=b.dataset.f; render(); }; });
    var L=keys.map(function(k){ var x=A[k]; x.k=k; return x; }).filter(function(x){ return F==='all'||(F==='s'?x.s:x.note); })
      .sort(function(a,b){ return b.book.localeCompare(a.book)||a.t-b.t||(a.q[0]===b.q[0]?(+a.q.slice(1))-(+b.q.slice(1)):(a.q<b.q?-1:1)); });
    if(!L.length){ main.innerHTML='<div class="card empty"><b class="et">Chưa có câu nào '+(F==='n'?'có ghi chú':'được đánh dấu')+'</b>Khi làm đề, bấm nút ☆ cạnh số câu để đánh dấu câu khó và viết ghi chú. Tất cả sẽ hiện ở đây để ôn lại.<p style="margin:14px 0 0"><a class="btn" href="./" style="text-decoration:none">Chọn đề để làm</a></p></div>'; return; }
    var h='', cur='';
    L.forEach(function(x){
      if(x.name!==cur){ cur=x.name; h+='<div class="grp">'+esc(x.name)+'</div>'; }
      h+='<div class="mk" data-k="'+esc(x.k)+'"><button class="st" title="Bỏ/đánh dấu" aria-pressed="'+!!x.s+'">'+(x.s?'★':'☆')+'</button><div><div class="meta">Câu '+esc(x.q.slice(1))+' · '+(x.q[0]==='L'?'Listening':'Reading')+'</div><div class="tx">'+esc(x.txt||'')+'</div></div>'+
        '<a href="'+esc(x.path)+'#Q-'+esc(x.q)+'">Mở câu →</a><textarea placeholder="Ghi chú…">'+esc(x.note||'')+'</textarea><button class="del">Xoá khỏi danh sách</button></div>';
    });
    main.innerHTML=h;
    [].forEach.call(main.querySelectorAll('.mk'),function(el){
      var k=el.dataset.k;
      function upd(fn){ var A=load(); if(!A[k]) return; fn(A[k]); if(!A[k].s&&!A[k].note) delete A[k]; save(A); }
      el.querySelector('.st').onclick=function(){ var b=this; upd(function(x){ x.s=!x.s; b.textContent=x.s?'★':'☆'; }); };
      el.querySelector('textarea').oninput=function(){ var v=this.value; upd(function(x){ x.note=v.trim()?v:''; }); };
      el.querySelector('.del').onclick=function(){ var A=load(); delete A[k]; save(A); render(); };
    });
  }
  render();
})();
</script>
<script src="shared/ui.js?v=6"></script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});});</script>
</body>
</html>
