<!DOCTYPE html>
<html lang="vi">
<head>
<script>try{var d=document.documentElement,k=JSON.parse(localStorage.getItem('mt.skin')||'""');if(k==='scifi')d.setAttribute('data-theme','dark');if(k)d.setAttribute('data-skin',k)}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#a8691a">
<link rel="apple-touch-icon" href="icons/apple-180.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="icons/fav-64.png?v=3">
<meta property="og:site_name" content="Minto English">
<meta property="og:title" content="Minto English · Các dạng bài IELTS Writing">
<meta property="og:image" content="https://mangomint1805.github.io/cam/og.png">
<meta name="twitter:card" content="summary_large_image">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Các dạng Writing · IELTS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#faf8f4;--card:#fff;--line:#ddd7c9;--ink:#1e232b;--dim:#666e7a;--panel2:#f2efe8;--brand:#a8691a;--brand-soft:#f2e2c4;--brand-ink:#6b4410;--ok:#1f8f6c;--ok-soft:#e1f4ec}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 50px}
header{padding:26px 0 6px}
.mback{font-size:14px;font-weight:700;color:var(--brand-ink);text-decoration:none}
h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(28px,6vw,40px);margin:10px 0 4px;line-height:1.1}
header p{margin:0;color:var(--dim)}
.gtabs{display:flex;gap:6px;overflow-x:auto;margin:16px -16px 0;padding:0 16px 4px;scrollbar-width:none}.gtabs::-webkit-scrollbar{display:none}
.gtabs button{flex:none;font:inherit;font-weight:700;font-size:14.5px;border:1.5px solid var(--line);background:var(--card);color:var(--dim);border-radius:12px;padding:9px 14px;cursor:pointer}
.gtabs button[aria-selected=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.tools input{flex:1 1 220px;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.tg{font:inherit;font-size:13.5px;font-weight:600;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}
.tg[aria-pressed=true]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.topics button{font:inherit;font-size:13.5px;font-weight:600;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.topics button small{color:var(--dim);font-weight:500}
.topics button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}.topics button[aria-pressed=true] small{color:#ccc}
html[data-theme=dark] .topics button[aria-pressed=true]{background:var(--brand);border-color:var(--brand)}
.th{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 8px}
.th h2{font:600 24px/1.2 Fraunces,Georgia,serif;margin:0}.th span{color:var(--dim)}
.th .btn{margin-left:auto}
.qs{background:var(--brand-soft);border-radius:14px;padding:12px 14px 12px 34px;margin:0 0 12px;font-size:14.5px;color:var(--brand-ink)}
.qs li{margin:2px 0}

.types{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.types button{font:inherit;font-size:14px;font-weight:600;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left}
.types button small{display:block;font-weight:500;color:var(--dim);font-size:12px}
.types button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}.types button[aria-pressed=true] small{color:#ccc}
html[data-theme=dark] .types button[aria-pressed=true]{background:var(--brand);border-color:var(--brand)}
.intro{color:var(--dim);margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card h3{margin:0 0 8px;font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
.card ul{margin:0;padding-left:20px}.card li{margin:4px 0}
.prompt{background:var(--brand-soft);color:var(--brand-ink);border-radius:12px;padding:12px 14px;font-size:15.5px;white-space:pre-line}
.thesis{margin-top:10px;font-size:15px}.thesis b{color:var(--brand-ink)}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 14px 44px;margin:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.steps li::after{content:'';position:absolute;left:14px;top:32px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps b{display:block;font-size:16px}
.steps .how{color:var(--ink);font-size:14.5px;margin:2px 0}
.steps .ex{font-size:14.5px;color:var(--brand-ink);background:var(--panel2);border-left:3px solid var(--brand);border-radius:0 8px 8px 0;padding:6px 10px;margin-top:4px;font-style:italic}
.links{display:flex;gap:6px;flex-wrap:wrap}
.links a{font-weight:700;font-size:13.5px;color:var(--brand-ink);background:var(--brand-soft);border-radius:999px;padding:6px 12px;text-decoration:none}
.ck li{list-style:none;margin-left:-20px;padding-left:28px;position:relative}.ck li::before{content:'☐';position:absolute;left:4px;color:var(--brand)}
.tm{display:inline-block;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:4px 10px;font-size:13px}
.btn{font:inherit;font-weight:700;font-size:14px;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:9px 14px;cursor:pointer}
.hint{font-size:13px;color:var(--dim)}
</style>
</head>
<body data-nav="wtypes">
<div class="wrap">
  <header>
    <a class="mback" href="./">← Trang chủ</a>
    <h1>Các dạng bài Writing</h1>
    <p>Nhận biết đề thuộc dạng nào, dàn bài từng đoạn viết gì, câu ví dụ và mẹo tránh mất điểm — cho cả Task 1 và Task 2.</p>
  </header>
  <div class="gtabs" id="gtabs" role="tablist"></div>
  <p class="intro" id="intro"></p>
  <div class="types" id="types"></div>
  <div id="main"></div>
  <div class="card" id="cl"></div>
</div>
<script src="shared/wtypes.js?v=1"></script>
<script>
(function(){
  var W=window.WTYPES||{tasks:[]}, PH=window.PHRASES, main=document.getElementById('main');
  function get(k,d){ try{ var v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
  function put(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var st=get('mt.wt',{}), ti=st.t||0, yi=st.y||{};
  var h0=decodeURIComponent(location.hash.slice(1)); if(h0) W.tasks.forEach(function(t,a){ t.types.forEach(function(y,b){ if(y.id===h0){ ti=a; yi[t.id]=b; } }); });
  var LN={'wt1-paraphrase':'Paraphrase đề','wt1-overview':'Câu Overview','wt1-trends':'Xu hướng tăng/giảm','wt1-degree':'Mức độ thay đổi','wt1-compare':'So sánh số liệu','wt1-approx':'Ước lượng','wt1-static':'Biểu đồ tĩnh','wt1-process':'Quy trình','wt1-maps':'Bản đồ','wt1-gt-apology':'Thư xin lỗi','wt1-gt-request':'Thư phàn nàn / đề nghị','wt2-intro':'Mở bài','wt2-opinion':'Nêu ý kiến','wt2-discuss':'Bàn hai quan điểm','wt2-advdis':'Ưu – nhược điểm','wt2-cause':'Nguyên nhân – giải pháp','wt2-linking':'Từ nối & ví dụ','wt2-conclusion':'Kết bài'};
  function render(){
    ti=Math.min(ti,W.tasks.length-1); var T=W.tasks[ti]; if(!T){ main.innerHTML=''; return; }
    document.getElementById('gtabs').innerHTML=W.tasks.map(function(t,i){ return '<button role="tab" data-t="'+i+'" aria-selected="'+(i===ti)+'">'+esc(({t1:'Task 1 · Academic',gt:'Task 1 · Viết thư (GT)',t2:'Task 2'})[t.id]||t.name)+'</button>'; }).join('');
    [].forEach.call(document.querySelectorAll('[data-t]'),function(b){ b.onclick=function(){ ti=+b.dataset.t; save(); render(); }; });
    document.getElementById('intro').textContent=T.intro||'';
    var k=Math.min(T.types.length-1,yi[T.id]||0), y=T.types[k];
    document.getElementById('types').innerHTML=T.types.map(function(x,i){ return '<button data-y="'+i+'" aria-pressed="'+(i===k)+'">'+esc(x.vi||x.t)+'<small>'+esc(x.t)+'</small></button>'; }).join('');
    [].forEach.call(document.querySelectorAll('[data-y]'),function(b){ b.onclick=function(){ yi[T.id]=+b.dataset.y; save(); render(); }; });
    var h='<div class="card"><h3>Nhận biết dạng '+esc(y.vi||y.t)+'</h3><ul>'+(y.recog||[]).map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>'+(y.time?'<p style="margin:10px 0 0"><span class="tm">⏱ '+esc(y.time)+'</span></p>':'')+'</div>';
    if(y.sample) h+='<div class="card"><h3>Đề ví dụ</h3><div class="prompt">'+esc(y.sample)+'</div>'+(y.thesis?'<p class="thesis"><b>Câu luận điểm mẫu:</b> <i>'+esc(y.thesis)+'</i></p>':'')+'</div>';
    h+='<div class="card"><h3>Dàn bài từng đoạn</h3><ol class="steps">'+(y.structure||[]).map(function(s){ return '<li><b>'+esc(s.p)+'</b><div class="how">'+esc(s.how)+'</div>'+(s.ex?'<div class="ex">'+esc(s.ex)+'</div>':'')+'</li>'; }).join('')+'</ol></div>';
    if(y.tips&&y.tips.length) h+='<div class="card"><h3>💡 Mẹo & lỗi hay gặp</h3><ul>'+y.tips.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul></div>';
    if(y.links&&y.links.length) h+='<div class="card"><h3>Mẫu câu dùng cho dạng này</h3><div class="links">'+y.links.map(function(l){ return '<a href="mau-cau.html#'+esc(l)+'">'+esc(LN[l]||l)+' →</a>'; }).join('')+'</div></div>';
    main.innerHTML=h;
    var cl=document.getElementById('cl'); if(W.checklist&&W.checklist.length){ cl.innerHTML='<h3>✅ Kiểm tra trước khi nộp bài</h3><ul class="ck">'+W.checklist.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>'; } else cl.hidden=true;
  }
  function save(){ put('mt.wt',{t:ti,y:yi}); }
  render();
})();
</script>
<script src="shared/ui.js?v=12"></script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});});</script>
</body>
</html>
