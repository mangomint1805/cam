<style>
:root{color-scheme:light;--paper:#faf8f4;--card:#fff;--line:#ddd7c9;--ink:#1e232b;--dim:#666e7a;--panel2:#f2efe8;--brand:#a8691a;--brand-soft:#f2e2c4;--brand-ink:#6b4410;--ok:#1f8f6c;--ok-soft:#e1f4ec;--bad:#c14636;--bad-soft:#fbe6e2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 50px}
header{padding:26px 0 8px}
.mback{font-size:14px;font-weight:700;color:var(--brand-ink);text-decoration:none}
h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(28px,6vw,40px);margin:10px 0 4px;line-height:1.1}
header p{margin:0;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-size:13px;font-weight:700;color:var(--dim);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.chip{font:inherit;font-weight:600;font-size:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip small{font-weight:500;opacity:.8}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;background:var(--brand);color:#fff;border-radius:12px;padding:12px 20px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--brand-ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:13px;color:var(--dim)}
.best{display:flex;gap:10px;margin-top:12px}
.best div{flex:1;background:var(--panel2);border-radius:12px;padding:8px 12px}.best b{display:block;font:600 24px/1.1 Fraunces,Georgia,serif;color:var(--brand-ink)}.best span{font-size:12.5px;color:var(--dim)}
/* game */
.hud{display:flex;gap:12px;align-items:center;font-weight:700;font-size:14px;margin:10px 0 6px}
.hud .hp{letter-spacing:2px}.hud .sp{margin-left:auto;color:var(--dim);font-weight:600}
.field{position:relative;height:min(52vh,440px);border-radius:16px;overflow:hidden;border:1.5px solid var(--line);
  background:linear-gradient(180deg,var(--card) 0%,var(--paper) 100%)}
.field::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:repeating-linear-gradient(90deg,var(--bad) 0 12px,transparent 12px 20px);opacity:.5}
.wd{position:absolute;top:0;transform:translateX(-50%);text-align:center;white-space:nowrap;pointer-events:none;will-change:top}
.wd b{display:inline-block;font:600 19px/1.1 Fraunces,Georgia,serif;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:5px 10px;box-shadow:0 4px 12px rgba(107,68,16,.1)}
.wd b u{text-decoration:none;color:var(--ok);background:var(--ok-soft);border-radius:3px}
.wd small{display:block;font-size:12.5px;color:var(--dim);margin-top:3px;max-width:220px;white-space:normal;line-height:1.3;background:rgba(255,255,255,.7);border-radius:6px;padding:1px 4px}
html[data-theme=dark] .wd small{background:rgba(0,0,0,.35)}
.wd.tgt b{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.wd.boom{animation:boom .35s ease-out forwards}
@keyframes boom{to{transform:translateX(-50%) scale(1.5);opacity:0}}
.wd.miss b{border-color:var(--bad);background:var(--bad-soft)}
.typ{display:flex;gap:8px;margin-top:10px}
.typ input{flex:1;font:600 20px/1 'IBM Plex Sans',sans-serif;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-width:0}
.typ input:focus{outline:none;border-color:var(--brand)}
.typ input.bad{animation:shake .25s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pop{position:absolute;font:700 15px/1 'IBM Plex Sans';color:var(--ok);pointer-events:none;animation:up .7s ease-out forwards}
@keyframes up{to{transform:translateY(-34px);opacity:0}}
.lvl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 34px/1 Fraunces,Georgia,serif;color:var(--brand-ink);pointer-events:none;animation:fade 1.2s forwards}
@keyframes fade{0%{opacity:0;transform:scale(.8)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.res{text-align:center}.res .sc{font:600 56px/1 Fraunces,Georgia,serif;color:var(--brand-ink)}
.miss-l{text-align:left;margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.miss-l li{background:var(--panel2);border-radius:10px;padding:7px 11px;font-size:14.5px}.miss-l b{font-family:Fraunces,Georgia,serif;font-size:16px}
@media (prefers-reduced-motion:reduce){.wd.boom,.pop,.lvl{animation-duration:.01s}}
</style>
</head>
<body data-nav="game">
<div class="wrap">
  <header>
    <a class="mback" href="./">← Trang chủ</a>
    <h1>Gõ từ rơi</h1>
    <p>Từ vựng rơi từ trên xuống — gõ đúng từ trước khi nó chạm đáy. Càng lâu càng nhanh!</p>
  </header>
  <div id="main"></div>
</div>
<script>
window.GAME_CFG = {
  site: 'ielts',
  fc: 'flashcards.html',
  pools: function () {
    var P = [], C = {}; try { C = JSON.parse(localStorage.getItem('vocab.cards')) || {}; } catch (e) {}
    var mine = Object.keys(C).map(function (k) { return { w: C[k].w || k, m: C[k].m || '', ipa: C[k].ipa || '' }; }).filter(function (x) { return /^[a-z][a-z' -]{1,24}$/i.test(x.w); });
    P.push({ id: 'mine', name: 'Flashcard của tôi', n: mine.length, words: mine });
    var G = (window.PHRASES || { groups: [] }).groups;
    G.forEach(function (g) {
      var L = [];
      g.topics.forEach(function (t) { t.items.forEach(function (it) { var k = String(it.k || '').replace(/[…().]/g, '').trim(); if (/^[a-z][a-z' -]{2,22}$/i.test(k) && k.split(' ').length <= 3) L.push({ w: k, m: it.kv || it.vi, ex: it.en }); }); });
      if (L.length) P.push({ id: g.id, name: g.name, n: L.length, words: L });
    });
    return P;
  },
  scripts: ['shared/phrases.js?v=1']
};
</script>
<script src="shared/game-typing.js?v=2"></script>
<script src="shared/ui.js?v=7"></script>

</body>
</html>
